name: Tests

on:
  push:
    branches:
      - main
      - 'track/*'
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Installs every tool pinned in rokit.toml (rojo, luau-lsp, lune, selene, stylua) onto PATH.
      - uses: CompeyDev/setup-rokit@v0.1.2

      - name: Run tests
        run: lune run tests/run.luau

      - name: Lint source
        run: selene src
